<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141233">
<link rel="manifest" href="./manifest.json">
<title>Heaven Survivors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#aee1ff; --sky-bot:#ffe9b8; --gold:#f4c14d; --ink:#2b2140;
    --panel:rgba(255,255,255,.88); --panel-b:#f4c14d;
    color-scheme: light dark;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --sky-top:#141233; --sky-bot:#2e2158; --ink:#f1ecff; --panel:rgba(26,20,50,.88); } }
  :root[data-theme="dark"]{ --sky-top:#141233; --sky-bot:#2e2158; --ink:#f1ecff; --panel:rgba(26,20,50,.88); }
  html,body{height:100%;margin:0;overscroll-behavior:none;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{ background:linear-gradient(var(--sky-top),var(--sky-bot)); color:var(--ink); font-family:system-ui,sans-serif; touch-action:none; }
  h1,h2{ font-family:'Cinzel',Georgia,serif; margin:.2em 0; }
  #wrap{position:relative;width:100%;height:100%;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  #hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:14px;right:14px;display:flex;justify-content:space-between;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.35);color:#fff;}
  #levelbar{position:fixed;top:calc(42px + env(safe-area-inset-top,0px));left:14px;right:14px;height:7px;background:rgba(255,255,255,.35);border-radius:4px;overflow:hidden;}
  #levelfill{height:100%;width:0%;background:var(--gold);transition:width .15s;}
  #overlay{position:fixed;inset:0;background:rgba(10,8,25,.55);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;}
  #card{background:var(--panel);border:1px solid var(--panel-b);border-radius:18px;padding:28px 24px;max-width:360px;color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.25);}
  #card p{line-height:1.5;opacity:.85;}
  button{background:var(--gold);color:#352505;border:none;padding:12px 26px;border-radius:24px;font-size:16px;font-weight:700;margin-top:14px;cursor:pointer;}
  button:focus-visible{outline:3px solid var(--ink);outline-offset:2px;}
  .hidden{display:none !important;}
  #choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px;}
  .choice{background:rgba(244,193,77,.18);border:1.5px solid var(--gold);border-radius:12px;padding:12px;width:142px;cursor:pointer;}
  .choice:focus-visible{outline:3px solid var(--ink);}
  .choice small{opacity:.8;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud"><span id="timer">0:00</span><span id="hp">♥ 100</span></div>
  <div id="levelbar"><div id="levelfill"></div></div>
  <div id="overlay"><div id="card">
    <h1>Heaven Survivors</h1>
    <p>Dusk is falling and shadow-wisps are climbing toward the gate. Guide your angel, loose bolts of holy light, and hold the line as long as grace allows.</p>
    <p><small>Move: WASD / arrows, or touch &amp; drag · attacks fire on their own</small></p>
    <button id="startBtn">Begin the Vigil</button>
  </div></div>
</div>
<script>
(function(){
const TAU = Math.PI*2;
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let W,H;
function resize(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight; }
addEventListener('resize',resize); resize();

const hpEl=document.getElementById('hp'), timerEl=document.getElementById('timer'), levelFill=document.getElementById('levelfill');
const overlay=document.getElementById('overlay'), card=document.getElementById('card'), startBtn=document.getElementById('startBtn');

let best=0;
try{ best=parseFloat(localStorage.getItem('heavenBest')||'0'); }catch(e){}

const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

const joy={active:false,ox:0,oy:0,dx:0,dy:0};
canvas.addEventListener('pointerdown',e=>{ e.preventDefault(); joy.active=true; joy.ox=e.clientX; joy.oy=e.clientY; joy.dx=0; joy.dy=0; });
addEventListener('pointermove',e=>{ if(joy.active){ joy.dx=e.clientX-joy.ox; joy.dy=e.clientY-joy.oy; } });
addEventListener('pointerup',()=>joy.active=false);
addEventListener('pointercancel',()=>joy.active=false);

let state='menu', t=0, lastSpawn=0, lastShot=0;
let player, enemies, bolts, orbs;

function resetGame(){
  player={x:W/2,y:H/2,r:16,hp:100,maxHp:100,speed:230,level:1,xp:0,xpNeed:10,fireRate:520,dmg:12,count:1,regen:0};
  enemies=[]; bolts=[]; orbs=[]; t=0; lastSpawn=0; lastShot=0;
}

function spawnEnemy(){
  const side=Math.floor(Math.random()*4); let x,y;
  if(side===0){x=-30;y=Math.random()*H;} else if(side===1){x=W+30;y=Math.random()*H;}
  else if(side===2){x=Math.random()*W;y=-30;} else {x=Math.random()*W;y=H+30;}
  const wave=1+t/45;
  enemies.push({x,y,r:14+Math.random()*6,hp:18*wave,speed:55+Math.random()*25+wave*4,dmg:8});
}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function update(dt){
  t+=dt;
  const interval=Math.max(.35,1.3-t/60);
  lastSpawn+=dt;
  if(lastSpawn>interval){ lastSpawn=0; spawnEnemy(); if(t>30) spawnEnemy(); }

  let mx=0,my=0;
  if(keys['w']||keys['arrowup'])my-=1; if(keys['s']||keys['arrowdown'])my+=1;
  if(keys['a']||keys['arrowleft'])mx-=1; if(keys['d']||keys['arrowright'])mx+=1;
  if(joy.active){ const d=Math.hypot(joy.dx,joy.dy); if(d>8){ mx=joy.dx/d; my=joy.dy/d; } }
  const mlen=Math.hypot(mx,my);
  if(mlen>0){ player.x+=(mx/mlen)*player.speed*dt; player.y+=(my/mlen)*player.speed*dt; }
  player.x=Math.max(player.r,Math.min(W-player.r,player.x));
  player.y=Math.max(player.r,Math.min(H-player.r,player.y));
  if(player.regen) player.hp=Math.min(player.maxHp,player.hp+player.regen*dt);

  lastShot+=dt*1000;
  if(lastShot>player.fireRate && enemies.length){
    lastShot=0;
    let target=null,bd=1e9;
    for(const e of enemies){ const d=dist(player,e); if(d<bd){bd=d;target=e;} }
    if(target){
      for(let i=0;i<player.count;i++){
        const spread=(i-(player.count-1)/2)*.25;
        const ang=Math.atan2(target.y-player.y,target.x-player.x)+spread;
        bolts.push({x:player.x,y:player.y,vx:Math.cos(ang)*420,vy:Math.sin(ang)*420,dmg:player.dmg,r:5});
      }
    }
  }

  for(let i=bolts.length-1;i>=0;i--){
    const b=bolts[i]; b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20){ bolts.splice(i,1); continue; }
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(dist(b,e)<b.r+e.r){
        e.hp-=b.dmg; bolts.splice(i,1);
        if(e.hp<=0){ orbs.push({x:e.x,y:e.y,r:6,val:8+Math.random()*4}); enemies.splice(j,1); }
        break;
      }
    }
  }

  for(const e of enemies){
    const d=dist(e,player)||1;
    e.x+=(player.x-e.x)/d*e.speed*dt; e.y+=(player.y-e.y)/d*e.speed*dt;
    if(d<e.r+player.r) player.hp-=e.dmg*dt;
  }

  for(let i=orbs.length-1;i>=0;i--){
    const o=orbs[i], d=dist(o,player);
    if(d<120){ o.x+=(player.x-o.x)*dt*6; o.y+=(player.y-o.y)*dt*6; }
    if(d<player.r+o.r){
      player.xp+=o.val; orbs.splice(i,1);
      if(player.xp>=player.xpNeed){ player.xp-=player.xpNeed; player.xpNeed*=1.35; player.level++; triggerLevelUp(); }
    }
  }

  if(player.hp<=0) endGame();
}

const UPGRADES=[
  {name:'Brighter Light',desc:'+35% damage',apply:p=>p.dmg*=1.35},
  {name:'Swift Grace',desc:'+18% move speed',apply:p=>p.speed*=1.18},
  {name:'Rapid Blessing',desc:'Faster bolts',apply:p=>p.fireRate*=.85},
  {name:'Twin Halos',desc:'+1 projectile',apply:p=>p.count+=1},
  {name:'Guardian Aura',desc:'+25 max grace, heal',apply:p=>{p.maxHp+=25;p.hp=Math.min(p.maxHp,p.hp+25);}},
  {name:'Healing Light',desc:'+1 grace/sec regen',apply:p=>p.regen+=1},
];

function triggerLevelUp(){
  state='levelup';
  const picks=[...UPGRADES].sort(()=>Math.random()-.5).slice(0,3);
  card.innerHTML=`<h2>Level ${player.level}</h2><p>Choose a blessing</p><div id="choices"></div>`;
  const box=card.querySelector('#choices');
  picks.forEach(u=>{
    const d=document.createElement('div'); d.className='choice'; d.tabIndex=0;
    d.innerHTML=`<strong>${u.name}</strong><br><small>${u.desc}</small>`;
    d.onclick=()=>{ u.apply(player); overlay.classList.add('hidden'); state='playing'; };
    box.appendChild(d);
  });
  overlay.classList.remove('hidden');
}

function endGame(){
  state='dead';
  if(t>best){ best=t; try{ localStorage.setItem('heavenBest',String(best)); }catch(e){} }
  card.innerHTML=`<h1>Called Home</h1><p>You held the gate for ${fmt(t)}.</p><p><small>Best vigil: ${fmt(best)}</small></p><button id="again">Try Again</button>`;
  overlay.classList.remove('hidden');
  card.querySelector('#again').onclick=()=>{ resetGame(); state='playing'; overlay.classList.add('hidden'); };
}

function fmt(s){ const m=Math.floor(s/60), sec=Math.floor(s%60); return m+':'+String(sec).padStart(2,'0'); }

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.3)';
  for(let i=0;i<5;i++){ const cx=((i*237+t*8)%(W+200))-100, cy=50+(i*73)%220; ctx.beginPath(); ctx.ellipse(cx,cy,58,20,0,0,TAU); ctx.fill(); }

  ctx.fillStyle='#ffe27a';
  for(const o of orbs){ ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,TAU); ctx.fill(); }

  ctx.fillStyle='#fff6c9';
  for(const b of bolts){ ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill(); }

  for(const e of enemies){
    ctx.fillStyle='rgba(170,120,255,.45)'; ctx.beginPath(); ctx.arc(e.x,e.y,e.r+4,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(55,28,80,.92)'; ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,TAU); ctx.fill();
  }

  if(player){
    ctx.strokeStyle='#f4c14d'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(player.x,player.y-player.r-10,10,4,0,0,TAU); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.moveTo(player.x-10,player.y); ctx.lineTo(player.x-28,player.y-10); ctx.lineTo(player.x-10,player.y+10); ctx.fill();
    ctx.beginPath(); ctx.moveTo(player.x+10,player.y); ctx.lineTo(player.x+28,player.y-10); ctx.lineTo(player.x+10,player.y+10); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(player.x,player.y,player.r,0,TAU); ctx.fill();
  }
}

function loop(ts){
  if(!loop.last) loop.last=ts;
  const dt=Math.min(.05,(ts-loop.last)/1000); loop.last=ts;
  if(state==='playing') update(dt);
  draw();
  if(player && (state==='playing'||state==='levelup')){
    hpEl.textContent='♥ '+Math.max(0,Math.ceil(player.hp));
    timerEl.textContent=fmt(t);
    levelFill.style.width=Math.min(100,player.xp/player.xpNeed*100)+'%';
  }
  requestAnimationFrame(loop);
}

startBtn.onclick=()=>{ resetGame(); state='playing'; overlay.classList.add('hidden'); };
requestAnimationFrame(loop);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
